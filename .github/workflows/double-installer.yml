name: Double Installer

on:
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
  push:
    branches: ['**']
    tags: ['double-installer-*']
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing installer tag to test and publish (empty means tests only)
        type: string
        required: false
      ref:
        description: Optional validation-only commit/ref; cannot combine with release tags
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: double-installer-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve mode and exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      test_ref: ${{ steps.resolve.outputs.test_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
        run: bash scripts/double-installer-release.sh resolve

  installer:
    needs: candidate
    name: Installer / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: x64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: macos, arch: x64, runner: macos-15-intel}
          - {os: macos, arch: arm64, runner: macos-15}
          - {os: windows, arch: x64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Record environment and verify prerequisites
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          HOST_ARCH: ${{ runner.arch }}
          HOST_OS: ${{ runner.os }}
        run: |
          mkdir -p test-results
          bash tests/github-actions/installer-ci-environment.sh 2>&1 | tee test-results/environment.log
      - name: Run quick installer checks
        run: bash tests/github-actions/run-installer-tests.sh --quick 2>&1 | tee test-results/installer.log
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  regressions:
    needs: candidate
    name: Repository regressions / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install release test dependencies
        run: python3 -m pip install -r tests/double-release/requirements.txt
      - name: Run applicable repository regressions
        run: |
          mkdir -p test-results
          python3 -m pytest -c tests/double-release/pytest.ini tests/double-release 2>&1 | tee test-results/release.log
          bash tests/github-actions/test-double-installer-release.sh 2>&1 | tee test-results/installer-release.log
          python3 tests/github-actions/test-installer-notes.py 2>&1 | tee test-results/installer-notes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regressions-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  integrations:
    needs: candidate
    name: Live release and real cron / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - name: Prepare disposable runner scheduler
        run: |
          sudo apt-get update
          sudo apt-get install -y cron jq
          sudo service cron start
      - name: Verify published package and scheduled execution
        env:
          GH_TOKEN: ${{ github.token }}
          DOUBLE_DISPOSABLE_CRON: '1'
        run: |
          mkdir -p test-results
          bash tests/github-actions/test-double-installer-live.sh 2>&1 | tee test-results/live-release.log
          bash tests/github-actions/test-double-installer-cron.sh 2>&1 | tee test-results/real-cron.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrations-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  validation-gate:
    name: Installer validation gate
    needs: [candidate, installer, regressions, integrations]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation group to pass
        env:
          INSTALLER_RESULT: ${{ needs.installer.result }}
          REGRESSIONS_RESULT: ${{ needs.regressions.result }}
          INTEGRATIONS_RESULT: ${{ needs.integrations.result }}
        run: |
          test "$INSTALLER_RESULT" = success
          test "$REGRESSIONS_RESULT" = success
          test "$INTEGRATIONS_RESULT" = success

  publish:
    name: Publish tested installer
    outputs:
      message: ${{ steps.notes.outputs.message }}
      eligible: ${{ steps.notes.outputs.eligible }}
    needs: [candidate, validation-gate]
    if: needs.candidate.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false

      - name: Verify validated tag identity
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          actual=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          test "$actual" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Package validated installer
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          bash scripts/double-installer-release.sh package --tag "$RELEASE_TAG"

      - name: Prepare installer release notes and announcement
        id: notes
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
        run: python3 scripts/double-installer-notes.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: bash scripts/double-installer-release.sh publish --tag "$RELEASE_TAG"

  telegram:
    name: Announce release in Telegram
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.eligible == 'true' && needs.publish.outputs.message != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Check Telegram configuration
        id: config
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        shell: python
        run: |
          import os
          from pathlib import Path
          if (os.environ.get('TELEGRAM_TOKEN') and
              os.environ.get('TELEGRAM_TO') == '-1002983024983' and
              os.environ.get('TELEGRAM_THREAD_ID') == '8'):
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write('ready=true\n')
          else:
              print('::warning::Telegram inputs are missing or destination/topic format is invalid; announcement skipped.')

      - name: Send release announcement
        id: send
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message_thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          message: ${{ needs.publish.outputs.message }}
          format: html
          disable_web_page_preview: true

      - name: Report delivery error
        if: ${{ steps.send.outcome == 'failure' }}
        run: echo '::warning::Telegram delivery failed; GitHub release remains published. Check the topic before rerunning; a rerun may duplicate an announcement.'
