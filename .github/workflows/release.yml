name: Release Double Component

on:
  push:
    tags:
      - 'machine-*'
      - 'double-agent-*'
      - 'double-installer-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Component release tag, for example double-installer-0.1.0-rc'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve exact release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          commit=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  installer-validation:
    name: Validate exact candidate before publication
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/double-installer-tests.yml
    with:
      ref: ${{ needs.candidate.outputs.commit }}

  release:
    name: Package and publish validated component
    needs: [candidate, installer-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false

      - name: Verify validated tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          actual=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          test "$actual" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Test release possibility
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            double-installer-*)
              bash tests/test-double-installer-release.sh
              bash scripts/double-release.sh package --tag "$RELEASE_TAG"
              ;;
            *) tests/test-double-release.sh --tag "$RELEASE_TAG" ;;
          esac

      - name: Publish release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: scripts/double-release.sh publish --tag "$RELEASE_TAG"

  published-installer:
    name: Published installer / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: [candidate, release]
    if: startsWith(inputs.tag || github.ref_name, 'double-installer-')
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: x64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: macos, arch: x64, runner: macos-15-intel}
          - {os: macos, arch: arm64, runner: macos-15}
          - {os: windows, arch: x64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Record environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          HOST_ARCH: ${{ runner.arch }}
          HOST_OS: ${{ runner.os }}
        run: |
          mkdir -p test-results
          bash tests/installer-ci-environment.sh 2>&1 | tee test-results/environment.log
      - name: Prepare disposable cron
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cron jq
          sudo service cron start
      - name: Test published installer
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
          DOUBLE_DISPOSABLE_CRON: ${{ matrix.os == 'linux' && matrix.arch == 'x64' && '1' || '0' }}
        run: bash tests/test-double-installer-published.sh 2>&1 | tee test-results/published.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-installer-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
