name: Release Double Component

on:
  push:
    tags:
      - 'machine-*'
      - 'double-agent-*'
      - 'double-installer-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Component release tag, for example double-installer-0.1.0-rc'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve exact release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          commit=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  installer-validation:
    name: Validate exact candidate before publication
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/double-installer-tests.yml
    with:
      ref: ${{ needs.candidate.outputs.commit }}

  release:
    name: Package and publish validated component
    needs: [candidate, installer-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false

      - name: Verify validated tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          actual=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          test "$actual" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Test release possibility
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            double-installer-*)
              bash tests/test-double-installer-release.sh
              bash scripts/double-release.sh package --tag "$RELEASE_TAG"
              ;;
            *) tests/test-double-release.sh --tag "$RELEASE_TAG" ;;
          esac

      - name: Publish release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: scripts/double-release.sh publish --tag "$RELEASE_TAG"

  published-installer:
    name: Verify downloaded installer release
    needs: [candidate, release]
    if: startsWith(inputs.tag || github.ref_name, 'double-installer-')
    permissions:
      contents: read
    uses: ./.github/workflows/double-installer-published-tests.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      commit: ${{ needs.candidate.outputs.commit }}
      test_ref: ${{ needs.candidate.outputs.commit }}
