name: Release Double Machine

on:
  push:
    tags:
      - 'machine-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Machine release tag, for example machine-of-ideas-1.2.3-rc'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish machine release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test release possibility
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/test-double-release.sh --tag "$RELEASE_TAG"

      - name: Publish release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/double-release.sh publish --tag "$RELEASE_TAG"
