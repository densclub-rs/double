name: Release Double Machine

on:
  push:
    tags:
      - 'machine-*'
      - 'double-agent-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Machine release tag, for example machine-of-goals-0.0.11-rc'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve exact release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            machine-*|double-agent-*) ;;
            *) echo 'Use double-installer.yml for installer releases' >&2; exit 1 ;;
          esac
          commit=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  release:
    name: Validate package and publish machine release
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false

      - name: Verify validated tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          actual=$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          test "$actual" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Test release possibility
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: tests/test-double-release.sh --tag "$RELEASE_TAG"

      - name: Publish release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: scripts/double-release.sh publish --tag "$RELEASE_TAG"
